# Локальная база для разработки: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chronic_truant
      POSTGRES_USER: chronic_truant
      POSTGRES_PASSWORD: chronic_truant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
